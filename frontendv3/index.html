<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jan Andrzejczyk | Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      
      body {
        font-family: 'Inter', sans-serif;
        color: #d1d5db;
        background-color: #0f1117;
        background-image:
          radial-gradient(circle at 0% 0%, rgba(249,115,22,0.06), transparent 40%),
          radial-gradient(circle at 100% 100%, rgba(6,182,212,0.04), transparent 40%);
        background-attachment: fixed;
        background-repeat: no-repeat;
      }
      
      /* Custom Scrollbar for the console look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #161e2d; 
      }
      ::-webkit-scrollbar-thumb {
        background: #374151; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4b5563;
      }

      /* Motion tokens */
      @keyframes view-enter {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: none; }
      }
      @keyframes tab-enter {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes scrim-enter {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes modal-enter {
        from { opacity: 0; transform: scale(0.96); }
        to   { opacity: 1; transform: scale(1); }
      }

      .animate-view-enter  { animation: view-enter 180ms cubic-bezier(.165,.84,.44,1) both; }
      .animate-tab-enter   { animation: tab-enter 120ms ease both; }
      .animate-scrim-enter { animation: scrim-enter 180ms ease both; }
      .animate-modal-enter { animation: modal-enter 240ms cubic-bezier(.165,.84,.44,1) both; }

      /* Status dot heartbeat — restrained, console-acceptable */
      @keyframes pulse-running {
        0%, 100% { box-shadow: 0 0 5px 0   rgba(34,197,94,0.45); }
        50%      { box-shadow: 0 0 11px 1px rgba(34,197,94,0.85); }
      }
      @keyframes pulse-stopped {
        0%, 100% { box-shadow: 0 0 0 0   rgba(234,179,8,0.0); }
        50%      { box-shadow: 0 0 7px 0 rgba(234,179,8,0.45); }
      }
      .pulse-running { animation: pulse-running 2400ms ease-in-out infinite; }
      .pulse-stopped { animation: pulse-stopped 3600ms ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
